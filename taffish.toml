[package]
name = "higlass"
kind = "tool"
version = "0.10.4"
release = 1
license = "MIT"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/higlass"

[command]
name = "taf-higlass"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/higlass:0.10.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["genomics", "visualization", "browser", "hic", "server"]
keywords = ["higlass", "hi-c", "genome-browser", "contact-map", "tileset", "cooler", "bigwig", "web-service"]
description = "Browser-based HiGlass server for interactive visualization of Hi-C contact maps and other tiled genomic tracks."

[upstream]
name = "HiGlass Docker"
version = "0.10.4"
type = "github"
repo = "higlass/higlass-docker"
homepage = "https://higlass.io/"
license = "MIT"
release_url = "https://github.com/higlass/higlass-docker/tree/v0.10.4"
downloads = "docker://higlass/higlass-docker:0.10.4"
citation = "Kerpedjiev et al. 2018. HiGlass: web-based visual exploration and analysis of genome interaction maps."
doi = "10.1186/s13059-018-1486-1"
pmid = "30143029"

[smoke]
backend = "docker"
timeout = 120
exist = ["higlass", "higlass-manage", "supervisord", "nginx", "uwsgi", "python", "curl"]
test = ["higlass --version | grep -F 'higlass-docker 0.10.4' && higlass -- --version | grep -F 'higlass-docker 0.10.4' && higlass --version | grep -F 'SERVER_VERSION: 1.14.8' && higlass --version | grep -F 'LIBRARY_VERSION: 1.11.4'", "higlass --help | grep -F 'Usage: higlass'", "higlass-manage help | grep -F 'Available subcommands'", "tmp=\"$(mktemp -d /tmp/taf-higlass-smoke.XXXXXX)\" && (higlass --host-port 8888 > \"$tmp/higlass.log\" 2>&1 & pid=\"$!\"; ok=0; for i in $(seq 1 45); do if curl -fsS http://127.0.0.1/api/v1/tilesets/ | grep -F '\"count\"' >/dev/null; then ok=1; break; fi; sleep 1; done; kill \"$pid\" 2>/dev/null || true; wait \"$pid\" 2>/dev/null || true; grep -F 'http://127.0.0.1:8888/' \"$tmp/higlass.log\" >/dev/null; test \"$ok\" -eq 1)"]
