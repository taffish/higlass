[package]
name = "higlass"
kind = "tool"
version = "2.3.5"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/higlass"

[command]
name = "taf-higlass"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/higlass:2.3.5-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["genomics", "visualization", "browser", "hic", "server"]
keywords = ["higlass", "hi-c", "genome-browser", "contact-map", "tileset", "cooler", "bigwig", "web-service"]
description = "Browser-based HiGlass server for interactive visualization of Hi-C contact maps and other tiled genomic tracks."

[upstream]
name = "HiGlass"
version = "2.3.5"
type = "github"
repo = "higlass/higlass"
homepage = "https://higlass.io/"
license = "MIT"
release_url = "https://github.com/higlass/higlass/tree/v2.3.5"
downloads = "https://github.com/higlass/higlass/tree/v2.3.5"
citation = "Kerpedjiev et al. 2018. HiGlass: web-based visual exploration and analysis of genome interaction maps."
doi = "10.1186/s13059-018-1486-1"
pmid = "30143029"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["higlass", "higlass-manage", "higlass-runtime", "higlass-smoke", "nginx", "uwsgi", "python", "curl", "timeout", "awk", "setsid"]
test = ["higlass-smoke identity", "higlass-smoke help", "higlass-smoke manage", "higlass-smoke imports", "higlass-smoke service-term", "higlass-smoke startup-int", "higlass-smoke critical"]
