[package]
name = "higlass"
kind = "tool"
version = "2.3.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/higlass"

[command]
name = "taf-higlass"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/higlass:2.3.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["genomics", "visualization", "browser", "hic", "server"]
keywords = ["higlass", "hi-c", "genome-browser", "contact-map", "tileset", "cooler", "bigwig", "web-service"]
description = "Browser-based HiGlass server for interactive visualization of Hi-C contact maps and other tiled genomic tracks."

[upstream]
name = "HiGlass"
version = "2.3.4"
type = "github"
repo = "higlass/higlass"
homepage = "https://higlass.io/"
license = "MIT"
release_url = "https://github.com/higlass/higlass/tree/v2.3.4"
downloads = "https://github.com/higlass/higlass/tree/v2.3.4"
citation = "Kerpedjiev et al. 2018. HiGlass: web-based visual exploration and analysis of genome interaction maps."
doi = "10.1186/s13059-018-1486-1"
pmid = "30143029"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 180
exist = ["higlass", "higlass-manage", "supervisord", "nginx", "uwsgi", "python", "curl"]
test = ["higlass --version | grep -F 'higlass 2.3.4' && higlass -- --version | grep -F 'higlass 2.3.4' && higlass --version | grep -F 'HIGLASS_VERSION: 2.3.4' && higlass --version | grep -F 'HIGLASS_COMMIT: 5600c33ba6431b1ca53db35be31838115673c843' && higlass --version | grep -F 'FRONTEND_BUILD: taffish-vite-viewer' && higlass --version | grep -F 'FRONTEND_SOURCE: higlass v2.3.4' && higlass --version | grep -F 'HIGLASS_DOCKER_SCAFFOLD_VERSION: 0.10.5' && higlass --version | grep -F 'SERVER_VERSION: 1.14.8' && higlass --version | grep -F 'SERVER_COMMIT: cbfe79fe3ae0e844b4c0c78142a83733c8cc66a2' && higlass --version | grep -F 'NUMBA_VERSION: 0.56.4' && higlass --version | grep -F 'LLVMLITE_VERSION: 0.39.1' && higlass --version | grep -F 'PANDAS_VERSION: 1.5.3' && higlass --version | grep -F 'CLODIUS_VERSION: 0.19.0'", "higlass --help | grep -F 'Usage: higlass' && higlass --help | grep -F -- '--startup-timeout'", "higlass-manage help | grep -F 'Available subcommands'", "python -c 'import clodius, cooler, pandas, numba; print(\"ok\")' | grep -Fx ok", "tmp=\"$(mktemp -d /tmp/taf-higlass-smoke.XXXXXX)\" && (higlass --host-port 8888 --startup-timeout 90 --log-file \"$tmp/supervisord.log\" > \"$tmp/higlass.log\" 2>&1 & pid=\"$!\"; ok=0; for i in $(seq 1 90); do if grep -F 'HiGlass is ready.' \"$tmp/higlass.log\" >/dev/null 2>&1 && curl -fsS http://127.0.0.1/api/v1/tilesets/ 2>/dev/null | grep -F '\"count\"' >/dev/null && curl -fsS 'http://127.0.0.1/api/v1/viewconfs/?d=default' 2>/dev/null | grep -F '\"views\"' >/dev/null && curl -fsS http://127.0.0.1/app 2>/dev/null | grep -F 'TAFFISH HiGlass' >/dev/null; then ok=1; break; fi; sleep 1; done; kill \"$pid\" 2>/dev/null || true; wait \"$pid\" 2>/dev/null || true; grep -F 'HiGlass is ready.' \"$tmp/higlass.log\" >/dev/null; grep -F 'http://127.0.0.1:8888/app' \"$tmp/higlass.log\" >/dev/null; test \"$ok\" -eq 1)"]
